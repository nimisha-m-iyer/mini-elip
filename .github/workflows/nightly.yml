name: nightly-ingest

on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST. GitHub may run it late.
  workflow_dispatch:         # lets you start it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_CACHE_DIR: /tmp/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/models
          key: fastembed-models-v1
      - run: python -m app.migrate
      - run: python -m scripts.ingest
      - run: python -m scripts.embed